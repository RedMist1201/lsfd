<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LSFD - Los Santos Fire Department</title>

    <!-- Google Font: Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ---------- RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(ellipse at center, #0f0f0f 0%, #050505 100%);
        }

        /* ---------- ANIMATSIOONID ---------- */
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(200, 30, 30, 0.3)); }
            50% { filter: drop-shadow(0 0 60px rgba(200, 30, 30, 0.7)) drop-shadow(0 0 100px rgba(200, 30, 30, 0.2)); }
        }

        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.6) translateY(60px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        /* ---------- ÜLDINE ---------- */
        #hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            width: 100%;
            max-width: 990px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* --- MAIN LEHT: VERTIKAALNE (logo peal, tekst all) --- */
        #hero .hero-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.8s ease;
        }

        #hero .logo-icon {
            animation: pulseGlow 3s infinite, float 4s ease-in-out infinite;
            margin-bottom: 16px;
            transition: all 0.8s ease;
        }

        #hero .logo-icon img {
            width: 180px;
            height: auto;
            display: block;
        }

        #hero h1 {
            font-weight: 900;
            font-size: 56px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #ffffff;
            transition: all 0.8s ease;
        }

        #hero h1 span {
            color: #cc0000;
        }

        #hero .subtitle {
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 6px;
            color: #666;
            margin-top: 8px;
            transition: all 0.8s ease;
        }

        #hero .badge-hero {
            display: inline-block;
            margin-top: 16px;
            background: #cc0000;
            color: #0a0a0a;
            font-weight: 700;
            font-size: 12px;
            padding: 8px 32px;
            border-radius: 4px;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 0 40px rgba(200, 0, 0, 0.2);
            transition: all 0.8s ease;
        }

        /* ---------- HERO VÄIKE REŽIIM (header) ---------- */
        #hero.compact {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            max-width: 100%;
            width: 100%;
            min-height: auto;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 2px solid #1a0a0a;
            backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 40px rgba(0,0,0,0.8);
            margin: 0;
        }

        /* --- HEADER: HORISONTAALNE (logo + tekst kõrvuti) --- */
        #hero.compact .hero-left {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
        }

        #hero.compact .logo-icon {
            animation: pulseGlow 3s infinite;
            margin-bottom: 0;
        }

        #hero.compact .logo-icon img {
            width: 50px;
            height: auto;
            display: block;
        }

        #hero.compact h1 {
            font-size: 18px;
            letter-spacing: 3px;
        }

        #hero.compact .subtitle,
        #hero.compact .badge-hero {
            display: none;
        }

        /* ---------- HERO MENÜÜ NUPPUD ---------- */
        .hero-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            transition: all 0.8s ease;
        }

        #hero.compact .hero-menu {
            margin-top: 0;
            gap: 4px;
        }

        .hero-menu button {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #aaaaaa;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 22px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .hero-menu button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(200, 0, 0, 0.1), transparent);
            transition: left 0.5s;
        }

        .hero-menu button:hover::before {
            left: 100%;
        }

        .hero-menu button:hover {
            border-color: #cc0000;
            color: #ffffff;
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .hero-menu button i {
            margin-right: 10px;
            color: #cc0000;
        }

        #hero.compact .hero-menu button {
            font-size: 9px;
            padding: 6px 12px;
            letter-spacing: 1px;
        }

        #hero.compact .hero-menu button i {
            margin-right: 4px;
            font-size: 10px;
        }

        /* ---------- SISU VAIK ---------- */
        #content-area {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 120px 20px 60px;
            display: none;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #content-area.active {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        #content-area.hiding {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #content-area.hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.9);
        }

        .content-card {
            background: linear-gradient(145deg, #0d0d0d, #151515);
            border-radius: 8px;
            padding: 40px 45px;
            border-left: 5px solid #cc0000;
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.6);
            animation: zoomIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .content-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .content-card h2 i {
            color: #cc0000;
            font-size: 30px;
        }

        .content-card h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, #cc0000, transparent);
            margin-left: 10px;
        }

        .content-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 17px;
            color: #cc0000;
            margin: 22px 0 12px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .content-card p,
        .content-card li {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            color: #c0c0c0;
            line-height: 1.9;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .content-card ul,
        .content-card ol {
            padding-left: 28px;
            margin: 10px 0;
        }

        .content-card li {
            margin-bottom: 8px;
        }

        .content-card li strong {
            color: #ffffff;
        }

        .content-card .highlight-box {
            background: #0f0f0f;
            border: 1px solid #1f1f1f;
            border-left: 4px solid #cc0000;
            padding: 18px 24px;
            margin: 18px 0;
            border-radius: 4px;
        }

        .content-card .highlight-box i {
            color: #cc0000;
            margin-right: 10px;
        }

        .content-card .highlight-box code {
            color: #cc0000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            background: #1a1a1a;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* Auastmed */
        .rank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin: 16px 0;
        }

        .rank-item {
            background: #0a0a0a;
            padding: 16px 20px;
            border-radius: 6px;
            border-left: 4px solid #cc0000;
            transition: all 0.3s;
            text-align: center;
        }

        .rank-item:hover {
            background: #141414;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.1);
        }

        .rank-item strong {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .rank-item small {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            color: #888;
            font-size: 11px;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* Käsud */
        .code-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
            margin: 12px 0;
        }

        .code-item {
            background: #0a0a0a;
            padding: 12px 16px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            border: 1px solid #1a1a1a;
            text-align: center;
            transition: all 0.3s;
        }

        .code-item:hover {
            border-color: #cc0000;
            box-shadow: 0 0 20px rgba(200, 0, 0, 0.1);
        }

        .code-item span {
            color: #cc0000;
            font-weight: 700;
        }

        /* Värbamine */
        .recruit-box {
            background: linear-gradient(135deg, #0a0a0a, #1a0505);
            border: 2px solid #cc0000;
            border-radius: 8px;
            padding: 28px 32px;
            text-align: center;
            box-shadow: 0 0 60px rgba(200, 0, 0, 0.05);
        }

        .recruit-box i {
            font-size: 48px;
            color: #cc0000;
            margin-bottom: 16px;
            animation: pulseGlow 3s infinite;
        }

        .recruit-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #ffffff;
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .recruit-box p {
            font-size: 14px;
            color: #aaaaaa;
            max-width: 600px;
            margin: 12px auto 0;
        }

        .recruit-box .highlight {
            color: #cc0000;
            font-weight: 700;
        }

        /* ---------- TAGASI NUPP ---------- */
        .back-btn {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            border-color: #cc0000;
            color: #ffffff;
            box-shadow: 0 0 30px rgba(200, 0, 0, 0.1);
        }

        .back-btn i {
            margin-right: 10px;
            color: #cc0000;
        }

        /* ---------- FOOTER ---------- */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #111;
        }

        footer p {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 10px;
            letter-spacing: 3px;
            color: #333;
            text-transform: uppercase;
        }

        footer p i {
            color: #cc0000;
            margin: 0 6px;
        }

        /* ---------- RESPONSIIVSUS ---------- */
        @media (max-width: 768px) {
            #hero h1 { font-size: 32px; letter-spacing: 4px; }
            #hero .logo-icon img { width: 130px; }
            .hero-menu button { font-size: 10px; padding: 8px 14px; }
            #hero.compact h1 { font-size: 14px; letter-spacing: 2px; }
            #hero.compact .logo-icon img { width: 38px; }
            #hero.compact .hero-menu button { font-size: 7px; padding: 4px 8px; letter-spacing: 0.5px; }
            .content-card { padding: 24px 18px; }
            .content-card h2 { font-size: 20px; flex-wrap: wrap; }
            .rank-grid { grid-template-columns: 1fr; }
            .code-grid { grid-template-columns: 1fr 1fr; }
            #hero.compact { padding: 8px 12px; flex-wrap: wrap; gap: 6px; }
            #hero.compact .hero-left { flex-wrap: wrap; gap: 8px; }
            #hero { min-height: 90vh; padding: 20px; }
        }

        @media (max-width: 480px) {
            #hero h1 { font-size: 20px; letter-spacing: 2px; }
            #hero .logo-icon img { width: 90px; }
            .code-grid { grid-template-columns: 1fr; }
            .hero-menu { gap: 6px; }
            .hero-menu button { font-size: 8px; padding: 6px 10px; letter-spacing: 1px; }
            #hero.compact .hero-menu button { font-size: 6px; padding: 3px 6px; letter-spacing: 0px; }
            #hero.compact h1 { font-size: 12px; letter-spacing: 1px; }
            #hero.compact .logo-icon img { width: 30px; }
            .content-card { padding: 16px 12px; }
            .content-card h2 { font-size: 16px; }
            .content-card p, .content-card li { font-size: 12px; }
        }
    </style>
</head>

        function showContent(sectionKey) {
            var data = contentData[sectionKey];
            if (!data) return;

            contentArea.classList.remove('hidden');
            contentArea.classList.remove('hiding');

            hero.classList.add('compact');
            contentArea.classList.add('active');

            contentDisplay.innerHTML = '<h2><i class="fas ' + data.icon + '"></i> ' + data.title + '</h2>' + data.html;

            setTimeout(function() {
                contentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);

            contentDisplay.style.animation = 'none';
            requestAnimationFrame(function() {
                contentDisplay.style.animation = 'zoomIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards';
            });
        }

        // ===== FUNKTSIOON: TAGASI AVALEHELE =====
        function goHome() {
            contentArea.classList.add('hiding');
            contentArea.classList.remove('active');

            setTimeout(function() {
                hero.classList.remove('compact');
                contentArea.classList.remove('hiding');
                contentArea.classList.add('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });

        }

        var buttons = document.querySelectorAll('.hero-menu button');
